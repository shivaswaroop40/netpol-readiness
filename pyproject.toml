[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npready"
version = "0.2.1"
description = "Enforcement-readiness analysis and adversarial evaluation for Kubernetes NetworkPolicies"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shivaswaroop Nittoor Krishnamurthy" }]
keywords = ["kubernetes", "networkpolicy", "security", "microsegmentation", "enforcement-readiness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
# Deliberately dependency-light: the core is stdlib-only so it can run inside a
# restricted CI pod. PyYAML is the single runtime dependency (reading manifests).
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
npready = "npready.cli:main"

[project.urls]
Homepage = "https://github.com/shivaswaroop40/netpol-readiness"
Source = "https://github.com/shivaswaroop40/netpol-readiness"
Issues = "https://github.com/shivaswaroop40/netpol-readiness/issues"
Changelog = "https://github.com/shivaswaroop40/netpol-readiness/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
npready = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# SIM115 (context-manager for one-shot CLI/test file reads) and PLW1510
# (we inspect subprocess returncode explicitly) are deliberate; not selected.
ignore = ["UP045"]   # keep Optional[...] for readability with py39 target

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

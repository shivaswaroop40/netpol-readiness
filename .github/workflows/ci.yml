name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repo. Raise per-job if a step ever
# needs to write (releases, comments), never at the top level.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --cov=npready --cov-report=term-missing

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
      - name: Lint chart
        run: helm lint ./attacks
      - name: Render chart
        run: helm template npready-attacks ./attacks > /dev/null
      - name: Schema rejects malformed target (security regression)
        run: |
          if helm template x ./attacks \
               --set 'families[0].enabled=true' \
               --set 'families[0].targets[0].host=evil;id' \
               --set 'families[0].targets[0].port=443' > /dev/null 2>&1; then
            echo "values.schema.json did NOT reject a malformed host — failing"; exit 1
          else
            echo "malformed host correctly rejected by values.schema.json"
          fi
      - name: Schema requires a digest-pinned image (security regression)
        run: |
          if helm template x ./attacks --set 'probe.image=busybox:latest' > /dev/null 2>&1; then
            echo "values.schema.json accepted a tag-only image — failing"; exit 1
          else
            echo "tag-only image correctly rejected (digest required)"
          fi
      - name: Schema rejects a malformed serviceAccountName (security regression)
        run: |
          if helm template x ./attacks \
               --set 'compromisedIdentity.serviceAccountName=a b;id' > /dev/null 2>&1; then
            echo "values.schema.json accepted a malformed serviceAccountName — failing"; exit 1
          else
            echo "malformed serviceAccountName correctly rejected"
          fi

  e2e-kind:
    # Readiness conformance: deploy a fixture, apply a policy, confirm the attack
    # roster reports the expected BLOCKED/OPEN matrix. Distinct from CNI conformance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          # kind's default CNI (kindnet) enforces NetworkPolicy on recent versions;
          # the e2e run relies on that. Ingress-source and egress edges are reported
          # out-of-scope by npready, so no extra CNI is installed here.
          cluster_name: npready-e2e
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: "3.13" }
      - name: Install npready
        run: pip install -e .
      - name: Run end-to-end
        run: bash examples/e2e/run.sh

apiVersion: v2
name: npready-attacks
description: >-
  ATT&CK-mapped, declaratively-deployable network-reachability attack roster for
  validating that Kubernetes NetworkPolicies block what they should. Each family is
  a fail-closed Job run from a compromised-workload identity; it probes one
  unauthorized edge and reports OPEN or BLOCKED. Deploy it against a namespace, turn
  your policies on, and see which edges are actually denied.
type: application
version: 0.3.0
appVersion: "0.3.0"
keywords: [security, networkpolicy, microsegmentation, attack-simulation, mitre-attack]
home: https://github.com/shivaswaroop40/netpol-readiness
sources: [https://github.com/shivaswaroop40/netpol-readiness]
maintainers:
  - name: Shivaswaroop Nittoor Krishnamurthy
annotations:
  # This chart deploys benign *probes*, not exploits. See THREAT_MODEL.md.
  category: SecurityTesting
